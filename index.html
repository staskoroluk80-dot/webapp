<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Клікер гра</title>
    <style>
        body { 
            background-color: #87CEEB; 
            margin: 0; 
            padding: 0; 
            font-family: Arial, sans-serif; 
            height: 100vh; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
        }
        .score-container { 
            margin-top: 50px; 
            text-align: center; 
        }
        .coins { 
            font-size: 48px; 
            font-weight: bold; 
            color: #FFD700; 
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3); 
        }
        .coin-icon { 
            font-size: 60px; 
            margin-bottom: 10px; 
        }
        .click-button { 
            margin-top: 50px;
            background: none;
            border: none;
            cursor: pointer;
            transition: transform 0.1s;
        }
        .click-button:hover {
            transform: scale(1.05);
        }
        .click-button:active {
            transform: scale(0.95);
        }
        .click-image {
            width: 200px;
            height: auto;
            border-radius: 20px;
            box-shadow: 0 9px 15px rgba(0,0,0,0.3);
        }
    </style>
</head>
<body>
    <div class="score-container">
        <div class="coin-icon">🪙</div>
        <div class="coins" id="coinDisplay">0</div>
    </div>
    
    <button class="click-button" id="clickButton">
        <img src="barley_gg_pin.png" alt="Клікай" class="click-image">
    </button>

    <script>
        let coins = 0;
        const coinDisplay = document.getElementById('coinDisplay');
        const clickButton = document.getElementById('clickButton');
        
        clickButton.addEventListener('click', function() { 
            coins++; 
            coinDisplay.textContent = coins; 
        });
    </script>
</body>
</html>
